<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>st-zip-converter</title>
  <!--
    Font Awesome 走**本地副本**（`src/vendor/fontawesome/`），不用 CDN：
    用户级全局规则 nocdn（零外部依赖）；且云/离线部署下 CDN 不可达会让全部图标失效
    （插件态不受影响 —— 酒馆宿主自带 FA，这个缺口只在独立形态暴露）。
    跨源请求归零由 `npm run e2e:web` 的信息项读数守护。详见该目录 README。
  -->
  <link rel="stylesheet" href="./src/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!--
    独立态骨架（单一模板源 · L1-MR-10）。
    此文件不含任何业务节点：工作台内容由 src/ui/workbench-template.js 的
    getWorkbenchHtml() 统一产出（与插件抽屉态、模态态同源），
    由 index.js 的 bootstrap() 注入到下面的空容器。
    禁止在本文件重新添加业务 id —— scripts/single-template-source.js 守卫会拦截。
  -->
  <div class="app-container app-standalone" id="app"></div>
  <!--
    经典脚本（**非 module**）：只为 `file://` 双击形态给一句「该怎么办」的说明。
    模块脚本在 file:// 下必然被 CORS 拒 ⇒ 没有它就只剩白屏。HTTP(S) 形态下它立即返回、
    一个字节都不动（否则就成了第二份工作台 UI，违反单一模板源铁律）。
    实测与边界登记见 e2e/standalone/specs/file-protocol.e2e.cjs。
  -->
  <script src="./file-protocol-notice.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
